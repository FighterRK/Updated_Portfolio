<div class="about-card">

    <div class="about-top">

        <div class="description">
            <div class="heading">
                <h1>{{ aboutMe() }}</h1>
            </div>

            <div class="paragraph">
                {{ description() }}
            </div>
        </div>

<div class="stat">
    <strong>2+</strong>
    <span>Years</span>
    <span>Experience</span>
</div>

<div class="stat">
    <strong>5+</strong>
    <span>Projects</span>
    <span>Built</span>
</div>

<div class="stat">
    <strong>100%</strong>
    <span>Passion</span>
    <span>for Development</span>
</div>

    </div>


    <div class="traits">

        <div class="trait">
            <!-- Problem Solver -->
            <svg viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M9 18h6"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
                <path d="M10 21h4"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
                <path d="M8.5 15.5C7.55 14.7 7 13.48 7 12.12
                         C7 9.85 8.79 8 11 8
                         C13.21 8 15 9.85 15 12.12
                         C15 13.48 14.45 14.7 13.5 15.5"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
                <path d="M11 3v2"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
                <path d="M4.64 5.64l1.41 1.41"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
                <path d="M17.95 7.05l1.41-1.41"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
            </svg>

            <span style="max-width: 123px;">Problem Solver</span>
        </div>


        <div class="trait">
            <!-- Continuous Learner -->
            <svg viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M3 5.5C5.5 4.5 8 4.5 11 6v13
                         c-3-1.5-5.5-1.5-8 0V5.5Z"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linejoin="round"/>
                <path d="M21 5.5C18.5 4.5 16 4.5 13 6v13
                         c3-1.5 5.5-1.5 8 0V5.5Z"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linejoin="round"/>
                <path d="M12 6v13"
                      stroke="currentColor"
                      stroke-width="1.8"/>
            </svg>

            <span  style="max-width: 123px !important">Continuous Learner</span>
        </div>


        <div class="trait">
            <!-- Team Player -->
            <svg viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <circle cx="9" cy="8" r="3"
                        stroke="currentColor"
                        stroke-width="1.8"/>
                <circle cx="17" cy="9" r="2.3"
                        stroke="currentColor"
                        stroke-width="1.8"/>
                <path d="M3.5 19c0-3 2.4-5 5.5-5s5.5 2 5.5 5"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
                <path d="M14.5 14.5c2.8-.2 5 1.5 5 4.5"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
            </svg>

            <span>Team Player</span>
        </div>


        <div class="trait">
            <!-- Open to Opportunities -->
            <svg viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M21 3 10.5 13.5"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
                <path d="m21 3-6.5 18-4-7-7-4L21 3Z"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>

            <span  style="max-width: 140px !important;">Open to Opportunities</span>
        </div>

    </div>

</div>
