<section class="contact-card">
  <div class="contact-content">

    <span class="eyebrow">CONTACT ME</span>

    <h2>
      Let’s <span>Talk</span>
    </h2>

    <p class="intro">
      I’m always open to discussing new<br />
      opportunities, interesting projects<br />
      or just a tech chat!
    </p>

    <div class="contact-details">

      <!-- Location -->
      <div class="contact-item">
        <div class="icon-box">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s7-6.1 7-12A7 7 0 0 0 5 9c0 5.9 7 12 7 12Z"
            />
            <circle cx="12" cy="9" r="2.5" />
          </svg>
        </div>

        <div>
          <strong>Kerala, India</strong>
          <span>(Open to Relocation)</span>
        </div>
      </div>

      <!-- Email -->
      <div class="contact-item">
        <div class="icon-box">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
        </div>

        <a href="mailto:rahulksuresh16@gmail.com">
          rahulksuresh16@gmail.com
        </a>
      </div>

      <!-- Phone -->
      <div class="contact-item">
        <div class="icon-box">
          <svg viewBox="0 0 24 24">
            <path
              d="M6.6 3.5 9 3l2 5-2.2 1.8a14 14 0 0 0 5.4 5.4L16 13l5 2 .5 2.4c.2 1.1-.6 2.2-1.7 2.4C11.4 21 3 12.6 4.2 4.2c.2-1.1 1.3-1.9 2.4-1.7Z"
            />
          </svg>
        </div>

        <a href="tel:+917012421278">
          +91 7012421278
        </a>
      </div>

    </div>

    <button class="message-btn" type="button" (click)="sendMessage()">
      <span>Send a Message</span>
      <span class="arrow">→</span>
    </button>

  </div>

  <!-- Illustration -->
  <div class="visual-area">

    <div class="glow-shape"></div>

    <div class="chat-illustration">

      <div class="chat-bubble bubble-one">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="chat-bubble bubble-two">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="spark spark-one"></div>
      <div class="spark spark-two"></div>
      <div class="spark spark-three"></div>

    </div>

    <div class="handwritten">
      <span>Ideas</span>
      <span>Collaboration</span>
      <span>Opportunities</span>
      <span>Let’s Talk!</span>

      <div class="underline"></div>
    </div>

  </div>

</section>
