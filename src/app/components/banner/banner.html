<div class="banner">
    <div class="content">
        <div class="hi"><span>👋 Hi, I'm</span></div>
        <div class="name">
            <h1>Rahul K Suresh</h1>
            <span class="role">Software Engineer</span>
        </div>
        <div class="info">
            <span class="typed-text">{{displayText()}}</span>
            <span class="typing-cursor"></span>
        </div>
        <div class="button-set">
            <div (click)="git()" class="btn-1"><button>View My Work</button></div>
            <div (click)="sendMessage()" class="btn-1"><button>Get In Touch</button></div>
        </div>
        <div class="icon-set">
            <ul>
                <li (click)="git()">GitHub <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5
           .08-1.25-.27-2.48-1-3.5
           .28-1.15.28-2.35 0-3.5
           0 0-1 0-3 1.5
           -2.64-.5-5.36-.5-8 0
           -2-1.5-3-1.5-3-1.5
           -.3 1.15-.3 2.35 0 3.5
           A5.4 5.4 0 0 0 3 9
           c0 3.5 3 5.5 6 5.5
           -.39.49-.68 1.05-.85 1.65
           -.17.6-.22 1.23-.15 1.85v4" />
                        <path d="M9 18c-4.51 2-5-2-7-2" />
                    </svg></li>
                <li (click)="linkedIn()">LinkedIn <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z" />
                        <rect width="4" height="12" x="2" y="9" />
                        <circle cx="4" cy="4" r="2" />
                    </svg></li>
                <li (click)="sendMessage()">Gmail <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2" />
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    </svg></li>
            </ul>
        </div>
    </div>

    <!-- Right Side -->
    <div class="visual">

        <!-- Decorative circles -->
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>

        <!-- Profile image -->
        <div class="profile-card">
            <img src="01 mail-1 (1).jpg" alt="Rahul K Suresh">
        </div>

        <!-- Floating code card -->
        <div class="code-card">
            <div class="code-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <code spellcheck="false">
      <span>const</span> developer = {{ '{' }}<br>
      &nbsp;&nbsp; passion: <b>"Building"</b>,<br>
      &nbsp;&nbsp; focus: <b>"Learning"</b>,<br>
      &nbsp;&nbsp; goal: <b>"Create Impact"</b><br>
      {{ '}' }};
    </code>
        </div>

        <!-- Build / Learn / Grow -->
        <div class="growth">
            <div class="arrow">↗</div>

            <div class="growth-text">
                <span>Build</span>
                <span>Learn</span>
                <span>Grow</span>
            </div>

            <div class="bottom-arrow">↗</div>
        </div>

    </div>

</div>
